services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: 4o-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: 4o
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${FOUR_O_DEV_POSTGRES_PASSWORD:?Set FOUR_O_DEV_POSTGRES_PASSWORD in your private shell before docker compose up}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - 4o_pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  4o_pg_data:
